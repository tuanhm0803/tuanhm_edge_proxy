services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - edge-network

  certbot:
    image: certbot/certbot
    container_name: edge-certbot
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      CERTBOT_EMAIL: hiitsling@gmail.com
      # Space-separated. Domains whose TLS this proxy terminates; each needs
      # a matching server block + map line in nginx.conf. Not aifakenews -
      # it manages its own cert.
      CERT_DOMAINS: autopretty.tuanhm.pro
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./scripts/certbot-loop.sh:/certbot-loop.sh:ro
    entrypoint: ["/bin/sh", "/certbot-loop.sh"]
    networks:
      - edge-network

networks:
  edge-network:
    name: edge-network
    driver: bridge
