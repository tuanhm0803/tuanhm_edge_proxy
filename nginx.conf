user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker's embedded DNS. Using it with a variable in proxy_pass (below)
    # makes nginx resolve container names at request time instead of only
    # once at startup, so this doesn't crash-loop if a backend container is
    # briefly recreated or isn't up yet on first boot.
    resolver 127.0.0.11 valid=10s;

    # Plain HTTP on port 80: serve ACME (Let's Encrypt) challenges for any
    # domain, redirect everything else to HTTPS. This block is what allows
    # certbot to issue/renew certs for new domains going forward.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # TLS termination for autopretty.tuanhm.pro, on a container-internal
    # port. The stream block below routes matching SNI traffic here as
    # plain TCP (it's already reached this same nginx process).
    #
    # NOTE: requires the certificate to exist first - see README.md "Adding
    # a new domain". Until then, leave this block and the matching map line
    # in stream{} commented out, or nginx will fail to start (missing cert
    # files).
    #
    # server {
    #     listen 127.0.0.1:8443 ssl;
    #     http2 on;
    #     server_name autopretty.tuanhm.pro;
    #
    #     ssl_certificate     /etc/letsencrypt/live/autopretty.tuanhm.pro/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/autopretty.tuanhm.pro/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     location / {
    #         set $autopretty_upstream autopretty-frontend;
    #         proxy_pass http://$autopretty_upstream:80;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    # }
}

# Layer-4 SNI router for port 443. This inspects the TLS ClientHello's SNI
# field WITHOUT decrypting it, so aifakenews.cloud keeps terminating its own
# TLS exactly as it always has (same cert, same renewal process, untouched
# by this proxy). New domains route to a "host:port" destination too - for
# autopretty that destination is this same nginx process's own loopback
# terminator above, once enabled.
stream {
    resolver 127.0.0.11 valid=10s;

    map $ssl_preread_server_name $backend {
        aifakenews.cloud       aifakenews-frontend-prod:443;
        www.aifakenews.cloud   aifakenews-frontend-prod:443;
        # autopretty.tuanhm.pro  127.0.0.1:8443;   # uncomment once cert exists
        default                aifakenews-frontend-prod:443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        # $backend holds "host:port"; using a variable (rather than a
        # literal) forces per-connection DNS resolution via the resolver
        # above instead of only at startup.
        proxy_pass $backend;
    }
}
