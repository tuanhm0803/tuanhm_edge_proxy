user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker's embedded DNS. Using it with a variable in proxy_pass (below)
    # makes nginx resolve container names at request time instead of only
    # once at startup, so this doesn't crash-loop if a backend container is
    # briefly recreated or isn't up yet on first boot.
    resolver 127.0.0.11 valid=10s;

    # Plain HTTP on port 80: serve ACME (Let's Encrypt) challenges for any
    # domain, redirect everything else to HTTPS. This block is what allows
    # certbot to issue/renew certs for new domains going forward.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # TLS termination for autopretty.tuanhm.pro, on a container-internal
    # port. The stream block below routes matching SNI traffic here as
    # plain TCP (it's already reached this same nginx process).
    #
    # The certificate path uses $ssl_server_name, so nginx loads it per
    # handshake instead of at startup. That lets nginx start before the
    # edge-certbot container has issued the cert (handshakes just fail until
    # it exists), and picks up renewed certs without a reload.
    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;
        server_name autopretty.tuanhm.pro;

        ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            set $autopretty_upstream autopretty-frontend;
            proxy_pass http://$autopretty_upstream:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # tuanhm.pro - personal site (tuanhm repo). Same per-handshake
    # certificate loading as autopretty above. www.tuanhm.pro gets its own
    # certificate and just redirects to the bare domain.
    server {
        listen 127.0.0.1:8444 ssl;
        http2 on;
        server_name tuanhm.pro;

        ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Admin uploads (photo, CV) are capped at 10 MB by the app.
        client_max_body_size 12m;

        location / {
            set $tuanhm_upstream tuanhm-frontend;
            proxy_pass http://$tuanhm_upstream:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 127.0.0.1:8444 ssl;
        http2 on;
        server_name www.tuanhm.pro;

        ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://tuanhm.pro$request_uri;
    }
}

# Layer-4 SNI router for port 443. This inspects the TLS ClientHello's SNI
# field WITHOUT decrypting it, so aifakenews.cloud keeps terminating its own
# TLS exactly as it always has (same cert, same renewal process, untouched
# by this proxy). New domains route to a "host:port" destination too - for
# autopretty that destination is this same nginx process's own loopback
# terminator above.
stream {
    resolver 127.0.0.11 valid=10s;

    map $ssl_preread_server_name $backend {
        aifakenews.cloud       aifakenews-frontend-prod:443;
        www.aifakenews.cloud   aifakenews-frontend-prod:443;
        autopretty.tuanhm.pro  127.0.0.1:8443;
        tuanhm.pro             127.0.0.1:8444;
        www.tuanhm.pro         127.0.0.1:8444;
        default                aifakenews-frontend-prod:443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        # $backend holds "host:port"; using a variable (rather than a
        # literal) forces per-connection DNS resolution via the resolver
        # above instead of only at startup.
        proxy_pass $backend;
    }
}
