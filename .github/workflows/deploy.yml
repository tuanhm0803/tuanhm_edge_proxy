name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "Syncing edge proxy config..."
            if [ ! -d /opt/edge/.git ]; then
              echo "First-time setup: turning /opt/edge into a checkout of this repo..."
              mkdir -p /opt/edge
              cd /opt/edge
              git init -b main
              git remote add origin git@github-edge:tuanhm0803/tuanhm_edge_proxy.git
              git fetch origin main
              # -f checks out tracked files from origin/main, overwriting local
              # copies. It does NOT touch untracked paths, so certbot/www and
              # certbot/conf (certificate data, gitignored) are left alone.
              git checkout -f -B main origin/main
            else
              cd /opt/edge
              # Authenticate with this repo's read-only deploy key. The
              # github-edge host alias is defined in ~/.ssh/config on the VPS
              # (see DEPLOY_KEYS_GUIDE.md in the aifakenews repo).
              git remote set-url origin git@github-edge:tuanhm0803/tuanhm_edge_proxy.git
              git fetch origin main
              # Match main exactly so hand edits on the VPS can't block the
              # update. Untracked certbot data is left alone.
              git reset --hard FETCH_HEAD
            fi

            mkdir -p certbot/www certbot/conf

            echo "Validating nginx config..."
            # Test the new config in a throwaway container first; with set -e
            # a bad config aborts here and the running proxy is left alone.
            # (Upstreams are all variables, resolved per request, so no
            # network access is needed for the test.)
            docker run --rm \
              -v /opt/edge/nginx.conf:/etc/nginx/nginx.conf:ro \
              -v /opt/edge/certbot/conf:/etc/letsencrypt:ro \
              nginx:1.27-alpine nginx -t

            echo "Ensuring edge proxy is up to date and running..."
            docker compose up -d --remove-orphans
            # nginx.conf is a single-file bind mount and git replaces the file
            # on checkout, so the running container would keep the old copy.
            # Restart to load the new one.
            docker compose restart nginx

            echo "Edge proxy status:"
            docker compose ps
